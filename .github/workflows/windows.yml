name: Windows candidate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/windows-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Install the pinned Electron runtime
        run: node node_modules/electron/install.js
      - run: npm run electron:build
      - run: npm run verify:p0-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate
          path: |
            out/windows/*/*.exe
            out/windows/*/verification.json
          if-no-files-found: warn
          retention-days: 14
